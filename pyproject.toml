[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uae-copilot"
version = "0.1.0"
description = "Agentic RAG copilot over UAE economic indicators (World Bank, IMF, UN)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Analytics Knowledge Copilot" }]
dependencies = [
    "groq>=0.11.0",
    "chromadb>=0.5.0",
    "duckdb>=1.1.0",
    "sentence-transformers>=3.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "streamlit>=1.36.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
]

[project.scripts]
uae-copilot = "uae_copilot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
